<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open & Welcome Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #message {
      display: none;
      margin-top: 20px;
      font-size: 24px;
      color: #333;
    }
    #imageContainer {
      display: none;
      margin-top: 20px;
    }
    #imageContainer img {
      max-width: 80%;
      height: auto;
      margin: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="openButton">open</button>

  <div id="message">welcome papa &lt;3</div>

  <div id="imageContainer">
    <!-- Replace “img1.jpg” and “img2.jpg” with your actual image filenames or paths -->
    <img src="photo1.jpeg" alt="Image 1" onerror="console.log('failed to load:', this.src)">
    <img src="photo2.jpeg" alt="Image 2" onerror="console.log('failed to load:', this.src)">

  </div>

  <script>
    const btn = document.getElementById("openButton");
    const msg = document.getElementById("message");
    const imgCont = document.getElementById("imageContainer");

    btn.addEventListener("click", function() {
      // Show the message
      msg.style.display = "block";
      // Show the images
      imgCont.style.display = "block";
      // Optionally disable or hide the button
      btn.disabled = true;
      // btn.style.display = "none";
    });
  </script>

</body>
</html>
